# Experimental variant of tuned_resnet18.toml for the CCSN in-domain condition only.
#
# Rationale: src/tune_resnet_family.py's 10-trial sweep tunes hyperparameters
# exclusively on the joint CCSN+GCD pool, then src/run_harmonized.py reuses the
# winning config (tuned_resnet18.toml, epochs=15) unchanged for the CCSN-only,
# GCD-only, and joint experiments. At batch_size=64, CCSN's smaller training
# split (1,495 images -> 24 steps/epoch) receives ~360 total optimizer steps
# over 15 epochs, while GCD's training split (9,155 images -> 144 steps/epoch)
# receives ~2,160 steps over the same nominal "15 epochs" -- a 6x disparity in
# gradient updates under an identically-named epoch budget, with a cosine LR
# schedule (T_max=epochs) that fully decays over a completely different number
# of steps for each condition. This variant raises CCSN's epoch count so its
# total optimizer-step count matches GCD's, isolating whether the CCSN vs GCD
# in-domain accuracy gap (~60% vs ~88%) narrows once training budget is
# controlled for, as opposed to being purely a domain/taxonomy effect (see
# docs/DECISIONS.md D-011 and docs/KNOWN_ISSUES.md).
#
# Step-matching arithmetic (batch_size=64, drop_last=False):
#   GCD:  ceil(9155/64) = 144 steps/epoch x 15 epochs = 2160 steps (unchanged)
#   CCSN: ceil(1495/64) = 24 steps/epoch  x  N epochs = 2160 steps -> N = 90
#
# All other hyperparameters are held identical to tuned_resnet18.toml so this
# is a controlled comparison against the existing approved CCSN in-domain
# result -- only `epochs` differs.
#
# This file is NOT a replacement for tuned_resnet18.toml and must not be used
# for the GCD or joint experiments. Not yet researcher-approved for the
# canonical benchmark; use via run_harmonized.py --experiment ccsn --config
# config/training/tuned_resnet18_ccsn_budget_matched.toml and compare against
# the existing harmonized_summary_resnet18.json ccsn_in_domain results.

name = "tuned_resnet18_ccsn_budget_matched"
approval_status = "draft"
model_architecture = "resnet18"
trial_id = "trial_08_no_label_smoothing"
trial_name = "AdamW + No Label Smoothing (0.0) -- CCSN step-budget matched to GCD"
derived_from = "tuned_resnet18.toml"

optimizer = "adamw"
lr_backbone = 5e-05
lr_head = 0.0005
weight_decay = 0.01
label_smoothing = 0.0
dropout_backbone = 0.3
dropout_head = 0.2
scheduler = "cosine_annealing"
eta_min = 0.000001
batch_size = 64
epochs = 90
seed = 42

[augmentation]
vertical_flip = false
horizontal_flip_p = 0.5
rotation_degrees = 15
color_jitter = [0.1, 0.1, 0.1]
resized_crop_scale = [0.8, 1.0]

[step_budget_reference]
note = "Reference figures from the analysis above, not measured from a run of this config."
gcd_steps_per_epoch = 144
gcd_epochs = 15
gcd_total_steps = 2160
ccsn_steps_per_epoch = 24
ccsn_epochs = 90
ccsn_total_steps = 2160
