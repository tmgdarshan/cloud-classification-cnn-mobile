# Dataset: GCD 6-Class (Dropping 7_mixed)
name = "GCD_6Class"
key = "gcd_6class"
approval_status = "approved"
sources = ["GCD"]

dataset_version = "2022"
relative_data_path = "GCD"
official_split = true
num_classes = 6
excluded_class_folders = ["7_mixed"]

taxonomy = "6-class operational sky-condition taxonomy (dropping mixed cloud)"
annotation_source = "Cooperatively annotated by meteorologists and ground-based cloud researchers (TJNU GCD; Liu et al., IEEE TGRS 2022)."
independent_sampling_unit = "image"

[provenance]
primary_publication = "Liu, S., Duan, L., Zhang, Z., Cao, X., & Durrani, T. S. (2022). Ground-based Remote Sensing Cloud Classification via Context Graph Attention Network. IEEE Transactions on Geoscience and Remote Sensing, 60, art. 5602711."
dataset_repository = "https://github.com/shuangliutjnu/TJNU-Ground-based-Cloud-Dataset"

[class_map]
"1_cumulus" = "Cumulus"
"2_altocumulus" = "Altocumulus and cirrocumulus"
"3_cirrus" = "Cirrus and cirrostratus"
"4_clearsky" = "Clear sky"
"5_stratocumulus" = "Stratocumulus, stratus and altostratus"
"6_cumulonimbus" = "Cumulonimbus and nimbostratus"
